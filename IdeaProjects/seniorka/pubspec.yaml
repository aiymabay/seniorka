name: seniorka
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP requests
  dio: ^5.7.0

  # Google Maps + Location
  google_maps_flutter: ^2.6.1
  geolocator: ^13.0.2
  flutter_polyline_points: ^2.0.0

  # Local storage (for saving tokens, user info)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation tools
  build_runner: ^2.4.9
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

